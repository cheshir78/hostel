<div class="container">
  <h2>Role Management</h2>
  
  <div class="role-assignment">
    <p>Assign roles to users</p>
    <div class="form-group">
      <label for="user">Select User:</label>
      <select id="user" name="user" [(ngModel)]="selectedUserId">
        <option *ngFor="let user of users$ | async" [value]="user.id">{{ user.username }}</option>
      </select>
    </div>
    <div class="role-list">
      <label *ngFor="let role of roles" class="checkbox">
        <input type="checkbox" [checked]="userRoles.includes(role)" (change)="toggleRole(role)">
        {{ role }}
      </label>
    </div>
    <button (click)="saveRoles()" class="btn btn-primary">Save Roles</button>
  </div>
</div>
