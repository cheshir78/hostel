<div class="container">
  <h2>{{ isEdit ? "Edit Room" : "Add New Room" }}</h2>
  
  <div *ngIf="loading" class="message">Loading room details...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  
  <form (ngSubmit)="save()" #roomForm="ngForm" class="form" *ngIf="!loading">
    <div class="form-group">
      <label for="number">Room Number:</label>
      <input type="text" id="number" name="number" [(ngModel)]="room.number" placeholder="e.g., 101">
    </div>
    <div class="form-group">
      <label for="name">Room Name:</label>
      <input type="text" id="name" name="name" [(ngModel)]="room.name" required placeholder="e.g., Deluxe Double">
    </div>
    <div class="form-group">
      <label for="capacity">Capacity (persons):</label>
      <input type="number" id="capacity" name="capacity" [(ngModel)]="room.capacity" required min="1" max="10">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a routerLink="/rooms" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
