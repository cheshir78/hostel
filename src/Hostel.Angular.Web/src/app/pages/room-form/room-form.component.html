<div class="container">
  <h2>{{ isEdit ? "Edit Room" : "Add New Room" }}</h2>
  
  <div *ngIf="loading" class="message">Loading room details...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  
  <form (ngSubmit)="save()" #roomForm="ngForm" class="form" *ngIf="!loading">
    <div class="form-group">
      <label for="number">Room Number:</label>
      <input type="text" id="number" name="number" [(ngModel)]="room.number" required>
    </div>
    <div class="form-group">
      <label for="name">Room Name:</label>
      <input type="text" id="name" name="name" [(ngModel)]="room.name" required>
    </div>
    <div class="form-group">
      <label for="capacity">Capacity:</label>
      <input type="number" id="capacity" name="capacity" [(ngModel)]="room.capacity" required min="1">
    </div>
    <div class="form-group">
      <label for="beds">Number of Beds:</label>
      <input type="number" id="beds" name="beds" [(ngModel)]="room.beds" required min="1">
    </div>
    <div class="form-group">
      <label for="price">Price per Night:</label>
      <input type="number" id="price" name="price" [(ngModel)]="room.price" required min="0" step="0.01">
    </div>
    <div class="form-group" *ngIf="isEdit">
      <label for="status">Status:</label>
      <select id="status" name="status" [(ngModel)]="room.status">
        <option value="AVAILABLE">Available</option>
        <option value="OCCUPIED">Occupied</option>
        <option value="MAINTENANCE">Maintenance</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a routerLink="/rooms" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
