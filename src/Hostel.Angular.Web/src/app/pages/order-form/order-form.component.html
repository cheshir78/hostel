<div class="container">
  <h2>{{ isEdit ? "Edit Booking" : "Create New Booking" }}</h2>
  
  <div *ngIf="loading" class="message">Loading order details...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  
  <form (ngSubmit)="save()" #orderForm="ngForm" class="form" *ngIf="!loading">
    <div class="form-group">
      <label for="name">Guest Name:</label>
      <input type="text" id="name" name="name" [(ngModel)]="order.name" required placeholder="Full name">
    </div>
    <div class="form-group">
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" [(ngModel)]="order.age" min="18" placeholder="Optional">
    </div>
    <div class="form-group">
      <label for="documentId">Document ID:</label>
      <input type="text" id="documentId" name="documentId" [(ngModel)]="order.documentId" placeholder="Passport or ID number (optional)">
    </div>
    <div class="form-group">
      <label for="roomId">Room:</label>
      <select id="roomId" name="roomId" [(ngModel)]="order.roomId" required>
        <option [value]="0">-- Select a room --</option>
        <option *ngFor="let room of rooms$ | async" [value]="room.id">{{ room.name }} ({{ room.capacity }} persons)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="dateFrom">Check-in Date:</label>
      <input type="date" id="dateFrom" name="dateFrom" [(ngModel)]="order.dateFrom" (change)="onDateFromChange()" required>
    </div>
    <div class="form-group">
      <label for="night">Number of Nights:</label>
      <input type="number" id="night" name="night" [(ngModel)]="order.night" (change)="onNightChange()" required min="1" max="365">
    </div>
    <div class="form-group">
      <label for="dateTo">Check-out Date:</label>
      <input type="date" id="dateTo" name="dateTo" [(ngModel)]="order.dateTo" disabled>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a routerLink="/orders" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
