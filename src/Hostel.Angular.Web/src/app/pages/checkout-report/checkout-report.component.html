<div class="container">
  <h2>Checkout Report</h2>

  <label for="report-date">Date:</label>
  <input id="report-date"
         type="date"
         [value]="selectedDate"
         (change)="onDateChange($any($event.target).value)" />

  <table class="checkout-table">
    <thead>
      <tr>
        <th>Room</th>
        <th>Number</th>
        <th>Capacity</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of (occupancy$ | async)?.allRooms">
        <td>{{ order.name }}</td>
        <td>{{ order.number }}</td>
        <td>{{ order.capacity }}</td>
      </tr>
    </tbody>
  </table>
</div>
