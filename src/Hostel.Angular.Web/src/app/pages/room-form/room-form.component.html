<div class="container">
  <h2>{{ isEdit ? "Edit Room" : "Add New Room" }}</h2>
  
  <form (ngSubmit)="save()" #roomForm="ngForm" class="form">
    <div class="form-group">
      <label for="name">Room Name:</label>
      <input type="text" id="name" name="name" [(ngModel)]="room.name" required>
    </div>
    <div class="form-group">
      <label for="beds">Number of Beds:</label>
      <input type="number" id="beds" name="beds" [(ngModel)]="room.beds" required>
    </div>
    <div class="form-group">
      <label for="price">Price per Night:</label>
      <input type="number" id="price" name="price" [(ngModel)]="room.price" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a routerLink="/rooms" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
